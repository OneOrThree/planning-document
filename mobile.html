<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>같이숲 · 모바일 미리보기</title>

<body>
  <header class="preview-header">
    <a class="preview-brand" href="mobile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 3C8 2 2 8 4 20 16 22 22 15 20 3Z M5 19 15 9"/></svg>같이숲</a>
    <h1>모바일 미리보기</h1>
    <a id="catalog-link" href="ia.html?screen=plaza">전체 화면 목록 ↗</a>
  </header>
  <main class="preview-main">
    <div class="preview-controls" aria-label="모바일 미리보기 설정">
      <label class="screen-picker"><span class="sr-only">시연할 화면</span><select id="mobile-screen" title="화면을 고르면 새 시연으로 시작해요"></select></label>
      <div class="orientation-control" role="group" aria-label="휴대폰 방향">
        <button type="button" id="portrait" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10 17h4"/></svg>세로</button>
        <button type="button" id="landscape" aria-pressed="false" aria-describedby="orientation-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10v4"/></svg>가로</button>
      </div>
      <button type="button" class="size-control" id="actual-size" aria-label="원래 크기로 보기" aria-pressed="false" title="화면 맞춤 / 원래 크기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5M4 4l6 6m10-6-6 6M4 20l6-6m10 6-6-6"/></svg></button>
      <label class="role-picker"><span class="sr-only">시연 역할</span><select id="mobile-role" title="역할을 바꾸면 새 시연으로 시작해요"><option value="OWNER">그룹장</option><option value="MEMBER">그룹원</option></select></label>
    </div>
    <section class="preview-stage" id="preview-stage" aria-label="베젤을 씌운 실제 동작 미리보기">
      <div class="device-space" id="device-space">
        <div class="phone" id="phone" data-orientation="portrait">
          <div class="hardware" aria-hidden="true"><i class="mute-key"></i><i class="volume-up"></i><i class="volume-down"></i><i class="power-key"></i></div>
          <div class="phone-screen">
            <div class="status-bar" aria-hidden="true"><span>9:41</span><svg viewBox="0 0 66 15"><path d="M1 11v2h3v-2zm5-3v5h3V8zm5-3v8h3V5zm5-3v11h3V2z"/><path d="M25 5q7-6 14 0m-11 3q4-4 8 0m-5 3q1-1 2 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="45" y="2" width="18" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="47" y="4" width="14" height="7" rx="1"/><path d="M65 5v5" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="camera-island" aria-hidden="true"><i></i></div>
            <iframe id="mobile-preview" title="같이숲 모바일 앱 · 직접 눌러서 사용하세요" allow="autoplay" width="390" height="770"></iframe>
            <div class="home-area" aria-hidden="true"><i></i></div>
            <div class="preview-loading" id="preview-loading" role="status">우리 숲을 불러오는 중</div>
          </div>
        </div>
      </div>
    </section>
    <footer class="preview-caption">
      <p id="orientation-note" aria-live="polite"></p>
      <p class="preview-meta"><span id="device-size">390 × 844</span><span aria-hidden="true">·</span><span id="preview-scale">화면 맞춤</span><span aria-hidden="true">·</span><span>실제 클릭 가능</span></p>
      <small>화면·역할 변경은 새 시연 · 회전은 상태 유지 · OS 기능은 HTML 시안</small>
    </footer>
  </main>
  <script src="ia-manifest.js?v=20260909-coop1"></script><script src="ia-structure.js?v=20260909-coop1"></script>
  <script src="mobile-preview.js"></script>
</body>
</html>

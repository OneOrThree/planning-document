<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>같이숲 · 디자인 작업실</title><style>@font-face{font-family:Gowun;src:url('assets/gachisup-r61/fonts/gowun-dodum.ttf');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f7f5ec;color:#344c39;font:16px/1.6 Gowun,sans-serif}header,main{max-width:1300px;margin:auto;padding:32px}h1{font-size:34px;font-weight:400;margin:8px 0}p{color:#62705e}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{padding:10px 16px;background:#e8eddf;border-radius:8px;text-decoration:none}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:18px 0;border-block:1px solid #d4ddc8}input,select,button{font:inherit;min-height:44px;border:1px solid #b4c2ab;border-radius:8px;padding:9px 12px;background:#fffdf6;color:inherit}input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:#4d724f}label{display:flex;align-items:center;gap:8px}.count{font-size:13px;margin:15px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:22px}.asset{min-width:0;background:#fffdf6;border:1px solid #dce2d3;border-radius:12px;overflow:hidden}.art{height:235px;background:repeating-conic-gradient(#e9ece2 0% 25%,#f5f4ec 0% 50%) 50%/24px 24px;display:flex;align-items:center;justify-content:center}.art img{width:100%;height:100%;object-fit:contain}.art.scene img{object-fit:cover}.asset-body{padding:14px}.asset h2{font-size:15px;font-weight:400;margin:0 0 7px}.asset code{display:block;font:11px/1.5 monospace;overflow-wrap:anywhere;color:#61745e}.asset small{display:block;color:#788071;font-size:12px}.asset audio{width:95%;height:44px}.asset a{display:block}footer{padding:32px;text-align:center;color:#62705e;font-size:13px}:focus-visible{outline:3px solid #9c6f38;outline-offset:3px}@media(max-width:600px){header,main{padding:20px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.art{height:180px}h1{font-size:29px}.asset-body{padding:10px}.toolbar input[type=search]{width:100%}}</style></head><body><header><small>같이숲 · 디자인 작업실</small><h1>우리 섬의 작은 조각들</h1><p>v2 전체 화면과 집중 프로토타입에 실제로 쓰인 확정 그림이에요. 출처와 목록 기준은 에셋 설명에 있어요.</p><nav><a href="feature-inventory.html">기획 문서 ↗</a><a href="assets/gachisup-r61/ui-kit/foundations/index.html">딸기 소다 UI 킷 ↗</a><a href="https://github.com/OneOrThree/planning-document/blob/main/assets/gachisup-r61/README.md">에셋 설명 ↗</a></nav></header><main><div class="toolbar"><label>종류<select id="category"><option value="all">모든 에셋</option><option value="backgrounds">섬과 바다</option><option value="buildings">건물</option><option value="characters">캐릭터</option><option value="boats">배</option><option value="props">소품</option><option value="ui">UI 아이콘</option></select></label><input id="time" type="hidden" value="all"><input id="search" type="search" aria-label="이름 또는 경로 검색" placeholder="이름 또는 경로 검색"><label><input id="detail" type="checkbox">개별 레이어·자세·프레임도 보기</label></div><p id="count" class="count" role="status"></p><div id="gallery" class="gallery"></div></main><footer>마을섬은 확정 6번 · 모닥불은 배경에 포함 · 상점 강아지는 상점 에셋에 포함</footer><script src="assets/gachisup-r61/gallery-data.js"></script><script>
const gallery=document.querySelector('#gallery');function render(){const category=document.querySelector('#category').value,time=document.querySelector('#time').value,q=document.querySelector('#search').value.trim().toLowerCase(),detail=document.querySelector('#detail').checked;const rows=R61_GALLERY.filter(e=>(category==='all'||e.category===category)&&(time==='all'||!/(day|night)/.test(e.file)||e.file.includes(time))&&(!e.detail||detail)&&(e.title+' '+e.file).toLowerCase().includes(q));gallery.replaceChildren();for(const e of rows){const card=document.createElement('article');card.className='asset';const art=document.createElement('div');art.className='art'+(e.category==='backgrounds'?' scene':'');if(e.file.endsWith('.wav')){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src='assets/gachisup-r61/'+e.file;art.append(audio);}else if(e.file.endsWith('.ttf')){art.textContent='같이숲 · 고운돋움';}else{const link=document.createElement('a');link.href='assets/gachisup-r61/'+e.file;link.style='width:100%;height:100%';const img=document.createElement('img');img.src=link.href;img.alt=e.title;img.loading='lazy';link.append(img);art.append(link);}const body=document.createElement('div');body.className='asset-body';const title=document.createElement('h2');title.textContent=e.title;const path=document.createElement('code');path.textContent='assets/gachisup-r61/'+e.file;const size=document.createElement('small');size.textContent=(e.width?e.width+' × '+e.height+' · ':'')+(e.transparent?'투명 PNG · ':'')+Math.round(e.bytes/1024)+' KB';body.append(title,path,size);card.append(art,body);gallery.append(card);}document.querySelector('#count').textContent=rows.length+'개 파일 · 체크무늬는 투명도를 보여 주는 갤러리 배경이에요.';}for(const id of ['category','time','detail'])document.querySelector('#'+id).onchange=render;document.querySelector('#search').oninput=render;render();</script></body></html>

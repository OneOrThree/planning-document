function transform(){$('world').setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);$('percent').textContent=Math.round(scale*100)+'%'}
function fitView(){const r=$('canvas').getBoundingClientRect();scale=Math.min(1.35,(r.width-70)/extent.w,(r.height-90)/extent.h);tx=(r.width-extent.w*scale)/2;ty=Math.max(10,(r.height-extent.h*scale)/2-10);transform()}
function zoom(f,x,y){const r=$('canvas').getBoundingClientRect();x??=r.width/2;y??=r.height/2;const next=Math.min(3,Math.max(.12,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inspect(id){if(T[id].group){toggle(id);return}selected=id;const s=D.screens[id];$('info').hidden=false;$('info').innerHTML=`<button class="close" aria-label="상세 닫기">×</button><span class="tag">${id} · ${esc(s.kind)}</span><h2>${esc(s.title)}</h2><p>${esc(s.purpose)}</p><h3>해금 조건</h3><p>${esc(D.gates[s.gate])}</p><h3>권한</h3><p>${esc(D.roles[s.role])}</p><h3>화면 상태</h3><p>${s.states.map(esc).join(' · ')}</p><h3>연결 가능한 화면 · 트리 선과 별도</h3><div class="chips">${s.next.filter(i=>T[i]).map(i=>`<button data-go="${i}">${i} ${esc(D.screens[i].title)}</button>`).join('')}</div>${(D.support[id]||[]).length?'<h3>이 화면에서 필요한 동작</h3>'+D.support[id].map(x=>'<p><strong>'+esc(x.title)+'</strong><br>'+esc(x.purpose)+'</p>').join(''):''}<h3>근거</h3><p>${s.source.map(i=>{const x=D.sources.find(x=>x.id===i);return `<a href="${esc(x.file)}">${esc(x.name)}</a>`}).join('<br>')}</p>`;$('info').querySelector('.close').onclick=()=>{$('info').hidden=true;selected=null;render(false)};$('info').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>reveal(b.dataset.go));history.replaceState(null,'','#focus='+encodeURIComponent(id==='PL-1'?'plaza':id.toLowerCase().replace('-','')));render(false)}
function reveal(id){if(!T[id])id=(D.supportOwners[id]||[])[0];if(!id)return;let branch=id;while(parent[branch])branch=parent[branch];scope=branch==='start'?'start':'root';$('scope').value=scope;let p=parent[id];while(p){expanded.add(p);p=parent[p]}mode='branch';render();inspect(id);const r=$('canvas').getBoundingClientRect(),c=coords[id];scale=Math.min(1.4,Math.max(.8,(r.width-400)/900));tx=Math.max(20,(r.width-360)/2)-(c.x+W/2)*scale;ty=r.height/2-(c.y+H/2)*scale;transform();$('results').hidden=true}
const scopes=['root','start','PL-1',...T['PL-1'].children.map(n=>n.id)];$('scope').innerHTML=scopes.map(id=>`<option value="${id}">${id==='root'?'전체 구조':esc(names[id]||T[id].label)}</option>`).join('');$('scope').onchange=()=>{scope=$('scope').value;mode='branch';function open(n){expanded.add(n.id);n.children.forEach(open)}open(T[scope]);$('info').hidden=true;render()};$('overview').onclick=()=>{scope='root';$('scope').value='root';expanded=new Set(['root','PL-1','fn-quests',...T['PL-1'].children.map(n=>n.id)]);mode='overview';$('info').hidden=true;render()};$('all').onclick=()=>{scope='root';$('scope').value='root';expanded=new Set(Object.keys(T));mode='all';$('info').hidden=true;render()};$('reset').onclick=$('percent').onclick=fitView;$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);
$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();$('results').hidden=!q;if(!q)return;const matches=Object.values(D.screens).filter(s=>T[s.id]).filter(s=>(s.id+' '+s.title+' '+s.purpose).toLowerCase().includes(q));$('results').innerHTML=matches.length?matches.map(s=>`<button data-go="${s.id}">${esc(s.title)}<small>${s.id} · ${esc(s.kind)}</small></button>`).join(''):'검색 결과가 없습니다.';$('results').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>reveal(b.dataset.go))};
let drag=null;$('diagram').addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};$('diagram').setPointerCapture(e.pointerId)});$('diagram').addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()});$('diagram').addEventListener('pointerup',()=>drag=null);$('diagram').addEventListener('pointercancel',()=>drag=null);$('canvas').addEventListener('wheel',e=>{if(e.target.closest('.info,.results'))return;e.preventDefault();const r=$('canvas').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});window.addEventListener('resize',fitView);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('info').hidden=true;$('results').hidden=true}if(e.target.matches('input,select'))return;if(e.key==='+')zoom(1.25);if(e.key==='-')zoom(.8);if(e.key==='0')fitView()});
